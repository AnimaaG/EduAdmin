
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage student enrollment in EduAdmin.">
  <title>Students | EduAdmin</title>

  <link rel="stylesheet" href="../../css/app.css">

  <script src="../../js/main.js" defer></script>
  <script src="../../js/navigation.js" defer></script>
  <script src="../../js/admin-sidebar.js" defer></script>
  <script type="module" src="../../js/admin-students.js"></script>
  <script type="module" src="../../js/admin-registration-requests.js"></script>
  <script type="module" src="../../js/account-menu.js"></script>
</head>

<body>
  <div class="dashboard-layout">
    <div id="admin-sidebar-mount"></div>

    <main class="dashboard-main">
      <header class="dashboard-topbar">
        <div class="topbar-left">
          <button
            type="button"
            class="sidebar-toggle"
            id="sidebar-toggle"
            aria-label="Open navigation menu"
            aria-controls="admin-sidebar"
            aria-expanded="false"
          >☰</button>

          <div>
            <h1>Students</h1>
            <p>Manage student enrollment and contact details.</p>
          </div>
        </div>
      </header>

      <div class="dashboard-content">
        <section class="page-heading">
          <div>
            <h1>Student management</h1>
            <p>Maintain student profiles and enrollment information.</p>
          </div>
        </section>

        <div
          id="students-message"
          class="message info"
          role="status"
          aria-live="polite"
          hidden
        ></div>

        <!-- Registered Students is rendered by admin-students.js. -->
      </div>
    </main>
  </div>

  <div class="sidebar-overlay" id="sidebar-overlay"></div>
</body>
</html>
