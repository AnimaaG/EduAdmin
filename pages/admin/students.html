<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Manage student profiles, assigned classes, fees, and enrollment status in EduAdmin."
  >

  <title>Students | EduAdmin</title>

  <link rel="stylesheet" href="../../css/app.css">

  <style>
    .students-page-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .students-page-heading h1 {
      margin: 0 0 7px;
      font-size: clamp(25px, 3vw, 32px);
      font-weight: 800;
      letter-spacing: -0.7px;
      color: #19233b;
    }

    .students-page-heading p {
      margin: 0;
      color: #788198;
      font-size: 14px;
      line-height: 1.6;
    }

    .students-page-icon {
      display: grid;
      place-items: center;
      flex-shrink: 0;
      width: 54px;
      height: 54px;
      border-radius: 17px;
      background: #eeedff;
      color: #594ce4;
      font-size: 25px;
    }

    .students-notice {
      margin-bottom: 20px;
    }

    .students-form-card {
      margin-bottom: 24px;
      padding: 24px;
      border: 1px solid #e7eaf2;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 6px 24px rgba(26, 39, 75, 0.045);
    }

    .students-form-heading {
      margin-bottom: 20px;
    }

    .students-form-heading h2 {
      margin: 0 0 6px;
      font-size: 20px;
      color: #19233b;
    }

    .students-form-heading p {
      margin: 0;
      color: #788198;
      font-size: 13px;
      line-height: 1.6;
    }

    .students-form-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .students-form-actions button {
      min-height: 42px;
      padding: 10px 18px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
    }

    .students-form-actions button[type="submit"] {
      background: #5c50e6;
      color: #fff;
    }

    .students-form-actions button[type="button"] {
      background: #f0f2f8;
      color: #414c63;
    }

    .students-form-actions button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    @media (max-width: 600px) {
      .students-page-heading {
        align-items: flex-start;
      }

      .students-page-icon {
        width: 44px;
        height: 44px;
        border-radius: 13px;
        font-size: 21px;
      }

      .students-form-card {
        padding: 17px;
      }
    }
  </style>

  <script src="../../js/main.js" defer></script>
  <script src="../../js/navigation.js" defer></script>
  <script src="../../js/admin-sidebar.js" defer></script>

  <script type="module" src="../../js/admin-students.js"></script>
  <script type="module" src="../../js/admin-registration-requests.js"></script>
  <script type="module" src="../../js/account-menu.js"></script>
</head>

<body>
  <div class="dashboard-layout">

    <div id="admin-sidebar-mount"></div>

    <main class="dashboard-main">

      <header class="dashboard-topbar">
        <div class="topbar-left">
          <button
            type="button"
            class="sidebar-toggle"
            id="sidebar-toggle"
            aria-label="Open navigation menu"
            aria-controls="admin-sidebar"
            aria-expanded="false"
          >☰</button>

          <div>
            <h1>Students</h1>
            <p>Manage student enrollment and contact details.</p>
          </div>
        </div>
      </header>

      <div class="dashboard-content">

        <section class="students-page-heading">
          <div>
            <h1>Student management</h1>
            <p>
              View assigned classes, joining dates, fees, and enrollment status.
            </p>
          </div>

          <div class="students-page-icon" aria-hidden="true">♙</div>
        </section>

        <div
          id="students-message"
          class="message info students-notice"
          role="status"
          aria-live="polite"
          hidden
        ></div>

        <section
          id="student-form-section"
          class="students-form-card"
          hidden
        >
          <div class="students-form-heading">
            <h2>Add student</h2>
            <p>Enter student details below.</p>
          </div>

          <form id="student-form">
            <div class="form-grid">

              <div class="form-group">
                <label for="student-name">Student name</label>
                <input
                  type="text"
                  id="student-name"
                  name="studentName"
                  placeholder="Enter full name"
                  autocomplete="name"
                  required
                >
              </div>

              <div class="form-group">
                <label for="student-email">Email address</label>
                <input
                  type="email"
                  id="student-email"
                  name="studentEmail"
                  placeholder="student@example.com"
                  autocomplete="email"
                  required
                >
              </div>

              <div class="form-group">
                <label for="student-phone">Contact number</label>
                <input
                  type="tel"
                  id="student-phone"
                  name="studentPhone"
                  placeholder="Enter contact number"
                  autocomplete="tel"
                >
              </div>

            </div>

            <div class="students-form-actions">
              <button type="submit">Add student</button>
              <button type="button" id="cancel-student-button">
                Cancel
              </button>
            </div>
          </form>
        </section>

        <!-- Student directory and status controls are rendered by admin-students.js. -->

      </div>
    </main>
  </div>

  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- EDIT STUDENT MODAL -->
  <div id="edit-student-modal" class="dashboard-section" style="position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px;" hidden>
    <div style="background: #fff; padding: 24px; border-radius: 16px; max-width: 520px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 12px 32px rgba(30,41,59,.16);">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h3 id="edit-modal-title" style="margin: 0; font-size: 18px; color: #19233b;">Edit Student Details</h3>
        <button type="button" id="close-edit-modal" class="secondary-button" style="background: transparent; border: none; font-size: 20px; cursor: pointer; color: #64748b;">&times;</button>
      </div>

      <form id="edit-student-form" class="form-grid">
        <input type="hidden" id="edit-student-id">

        <div class="form-group" style="grid-column: 1 / -1;">
          <label for="edit-student-name">Full name *</label>
          <input type="text" id="edit-student-name" required style="width: 100%; min-height: 40px; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 8px;">
        </div>

        <div class="form-group" style="grid-column: 1 / -1;">
          <label for="edit-student-email">Email address *</label>
          <input type="email" id="edit-student-email" required style="width: 100%; min-height: 40px; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 8px;">
        </div>

        <div class="form-group" style="grid-column: 1 / -1;">
          <label for="edit-student-phone">Contact number</label>
          <input type="tel" id="edit-student-phone" style="width: 100%; min-height: 40px; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 8px;">
        </div>

       <!-- Replace the single class select with this multi-class container -->
        <div class="form-group" style="grid-column: 1 / -1;">
          <label>Assigned Classes *</label>
          <div id="edit-student-classes-container" style="display: grid; gap: 8px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; max-height: 160px; overflow-y: auto;">
            <span style="color: #64748b; font-size: 13px;">Loading classes...</span>
          </div>
        </div>

        <div class="form-group" style="grid-column: 1 / -1;">
          <label for="edit-student-status">Enrollment Status *</label>
          <select id="edit-student-status" required style="width: 100%; min-height: 40px; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff;">
            <option value="active">Active</option>
            <option value="left">Left class</option>
            <option value="terminated">Terminated</option>
          </select>
        </div>

        <div class="form-actions full-width" style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 1rem; grid-column: 1 / -1;">
          <button type="button" id="cancel-edit-modal" style="min-height: 40px; padding: 8px 16px; border: 1px solid #cbd5e1; background: #f8fafc; border-radius: 8px; cursor: pointer; font-weight: 700;">Cancel</button>
          <button type="submit" style="min-height: 40px; padding: 8px 18px; border: none; background: #5c50e6; color: #fff; border-radius: 8px; cursor: pointer; font-weight: 700;">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
