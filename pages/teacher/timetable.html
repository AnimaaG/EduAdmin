<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timetable | EduAdmin</title>
  <link rel="stylesheet" href="../../css/app.css">
  <link rel="stylesheet" href="../../css/teacher-timetable.css">
  <style>
 
.timetable-page {
  width: 100%;
  min-width: 0;
}

.timetable-page [hidden] {
  display: none !important;
}

/* Header and navigation */
.timetable-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 22px;
  flex-wrap: wrap;
}

.timetable-week-info h2 {
  margin: 0 0 5px;
  font-size: 21px;
  font-weight: 700;
  color: var(--text-primary, #172033);
}

.timetable-week-info p {
  margin: 0;
  color: var(--text-secondary, #718096);
  font-size: 13px;
}

.timetable-navigation {
  display: flex;
  align-items: center;
  gap: 8px;
}

.timetable-nav-btn,
.timetable-today-btn {
  height: 38px;
  border: 1px solid #e2e8f0;
  border-radius: 9px;
  background: #fff;
  color: #263248;
  cursor: pointer;
  font-size: 14px;
  transition: 0.2s ease;
}

.timetable-nav-btn {
  width: 38px;
  font-size: 22px;
}

.timetable-today-btn {
  padding: 0 17px;
  font-weight: 600;
}

.timetable-nav-btn:hover,
.timetable-today-btn:hover {
  background: #f1f4ff;
  border-color: #c7d2fe;
  color: #4f46e5;
}

/* Loading and empty state */
.timetable-status {
  padding: 35px 20px;
  text-align: center;
  color: #718096;
  background: #fff;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
}

/* Seven-day calendar */
.timetable-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 12px;
  width: 100%;
  min-width: 0;
  align-items: stretch;
  overflow: visible;
}

.timetable-day {
  min-width: 0;
  min-height: 250px;
  background: #fff;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  overflow: hidden;
  transition: border-color 0.2s ease;
}

/* Day header */
.timetable-day-header {
  padding: 14px 5px;
  text-align: center;
  background: #f8fafc;
  border-bottom: 1px solid #e5e7eb;
}

.timetable-day-header .day-name {
  display: block;
  font-size: 13px;
  font-weight: 700;
  color: #1e293b;
}

.timetable-day-header .day-date {
  display: block;
  margin-top: 6px;
  font-size: 12px;
  color: #718096;
}

/* Today's column */
.timetable-day.is-today {
  border: 1px solid #5145ff;
}

.timetable-day.is-today .timetable-day-header {
  background: #eef2ff;
}

/* Session cards */
.timetable-sessions {
  display: flex;
  flex-direction: column;
  gap: 9px;
  padding: 9px;
}

.timetable-session {
  padding: 10px;
  border-left: 3px solid #5145ff;
  border-radius: 8px;
  background: #f8fafc;
  overflow-wrap: anywhere;
}

.timetable-session h3 {
  margin: 0 0 6px;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.4;
  color: #172033;
}

.timetable-session .session-subject {
  margin: 0 0 9px;
  font-size: 11px;
  line-height: 1.5;
  color: #718096;
}

.timetable-session .session-time {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 3px;
  font-size: 10px;
  font-weight: 600;
  line-height: 1.5;
  color: #334155;
}

/* Empty day */
.timetable-empty-day {
  padding: 22px 4px;
  text-align: center;
  font-size: 11px;
  color: #a0aec0;
}

/* Medium screens */
@media (max-width: 1100px) {
  .timetable-grid {
    grid-template-columns: repeat(7, minmax(125px, 1fr));
    overflow-x: auto;
    padding-bottom: 10px;
  }

  .timetable-day {
    min-width: 125px;
  }
}

/* Mobile screens */
@media (max-width: 600px) {
  .timetable-toolbar {
    align-items: flex-start;
  }

  .timetable-week-info h2 {
    font-size: 18px;
  }

  .timetable-navigation {
    width: 100%;
    justify-content: flex-end;
  }

  .timetable-grid {
    grid-template-columns: repeat(7, minmax(135px, 1fr));
  }

  .timetable-day {
    min-width: 135px;
  }
}

  </style>
</head>
<body>

  <div class="dashboard-layout">
    <div id="teacher-sidebar-mount"></div>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <main class="dashboard-main">
      <header class="dashboard-topbar">
        <div class="topbar-left">
          <button
            type="button"
            class="sidebar-toggle"
            id="sidebar-toggle"
            aria-label="Open navigation menu"
            aria-controls="teacher-sidebar"
            aria-expanded="false"
          >☰</button>

          <div>
            <h1>Timetable</h1>
            <p>View your weekly class schedule.</p>
          </div>
        </div>

        <div class="topbar-actions">
          <div id="account-menu-mount"></div>
        </div>
      </header>

      <div class="dashboard-content">
        <section class="timetable-page">

          <div class="timetable-toolbar">
            <div class="timetable-week-info">
              <h2 id="week-title">Loading week...</h2>
              <p id="week-subtitle">Your scheduled classes</p>
            </div>

            <div class="timetable-navigation">
              <button type="button" id="previous-week" class="timetable-nav-btn"
                aria-label="Previous week">‹</button>

              <button type="button" id="today-button" class="timetable-today-btn">
                Today
              </button>

              <button type="button" id="next-week" class="timetable-nav-btn"
                aria-label="Next week">›</button>
            </div>
          </div>

          <div id="timetable-status" class="timetable-status">
            Loading your timetable...
          </div>

          <div id="timetable-grid" class="timetable-grid" hidden></div>

        </section>
      </div>
    </main>
  </div>

  <script src="../../js/main.js" defer></script>
  <script src="../../js/navigation.js" defer></script>
  <script src="../../js/teacher-sidebar.js" defer></script>
  <script type="module" src="../../js/teacher-timetable.js"></script>
  <script type="module" src="../../js/account-menu.js"></script>

</body>
</html>
